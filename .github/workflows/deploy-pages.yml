name: Deploy Platform to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # ضع ملف APK الخاص بالتطبيق داخل مجلد الموقع ليكون رابط التنزيل دائماً.
      # يُجلب من أحدث إصدار (Release) إن وُجد، ولا يفشل البناء إن لم يوجد.
      - name: Attach Android APK + ZIP from latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern '*.apk' --dir dist --clobber || true
          gh release download --repo "${{ github.repository }}" --pattern '*.zip' --dir dist --clobber || true
          ls -lh dist/*.apk dist/*.zip 2>/dev/null || echo "no apk/zip in release yet"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
