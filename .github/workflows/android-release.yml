name: Build & Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" android/smart-teacher.apk
          (cd android && zip -j -9 smart-teacher.zip smart-teacher.apk)
          ls -lh android/smart-teacher.apk android/smart-teacher.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-teacher-apk
          path: |
            android/smart-teacher.apk
            android/smart-teacher.zip

      - name: Publish to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/smart-teacher.apk
            android/smart-teacher.zip
