name: Build & Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > android/local.properties

      # مفتاح التوقيع: إن وُجد سرّ ANDROID_KEYSTORE_BASE64 نستخدمه (توقيع ثابت)،
      # وإلا نولّد مفتاحاً مؤقتاً حتى لا يفشل البناء أبداً.
      - name: Provide signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KS="android/app/alfaeq-teacher.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=${KS_PW:-teacher123}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${K_ALIAS:-teacher}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${K_PW:-teacher123}" >> "$GITHUB_ENV"
            echo "Keystore: restored from secret (stable signing)."
          else
            keytool -genkeypair -v -keystore "$KS" -alias teacher \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass teacher123 -keypass teacher123 \
              -dname "CN=Smart Teacher, OU=Education, O=Alfaeq, L=Sanaa, C=YE"
            echo "Keystore: generated a throwaway key (signing is NOT stable across builds)."
            echo "→ add repo secret ANDROID_KEYSTORE_BASE64 for stable updates."
          fi

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" android/smart-teacher.apk
          (cd android && zip -j -9 smart-teacher.zip smart-teacher.apk)
          ls -lh android/smart-teacher.apk android/smart-teacher.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-teacher-apk
          path: |
            android/smart-teacher.apk
            android/smart-teacher.zip

      - name: Publish to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/smart-teacher.apk
            android/smart-teacher.zip
